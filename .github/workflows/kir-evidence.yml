name: CI — KIR compiler evidence

# Proof obligations for the production compiler path:
#   1. the complete offline KIR + decompile/recovery suites stay green;
#   2. historical emitter bytes remain frozen by their parity fixtures;
#   3. the exact generated Execute bodies compile against the real
#      RevitAPI/RevitAPIUI reference sets for every shipped year, 2021–2026.
#
# The six-version job runs on Linux deliberately: that is the compile-service
# production OS, and net48 references are therefore exercised through the same
# NuGet fallback path as the VPS rather than through a Windows SDK installation.
#
# 2026-08-04: obligation 3 used to mean `gate_runner` ALONE — the KIR corpus, and
# nothing else. Four other compile matrices existed, all measured by hand, none
# automated: the emitted C# outside kukai/audit, the audit rules themselves, the
# perception-graph queries, and the KIR gap rows. That is why `82/84` on the
# create_element templates only ever surfaced when a human ran a script. The
# Roslyn service is already provisioned, warm and /ready in this job, so the
# marginal cost of the four is seconds — they run below, in the SAME step, while
# the service is up (it is a background process with a cleanup trap; anything
# started after the step ends has no service to talk to).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/kir_idempotence.py'
      - 'backend/kukai/ir/**'
      - 'backend/kukai/compile_client.py'
      - 'backend/kukai/compiler_contract.py'
      - 'backend/kukai/compiler_contracts/**'
      - 'backend/kukai/llm/envelope.py'
      - 'backend/kukai/llm/revit_execution_pipeline.py'
      - 'backend/kukai/operations/**'
      - 'backend/kukai/storage/database.py'
      - 'backend/kukai/api/bridge_protocol.py'
      - 'backend/kukai/api/ws_registry.py'
      # Sources the four added compile matrices take as INPUT. Without these the
      # gate would not fire on the very edits it exists to catch — a rule that
      # never runs on the change it guards is not a gate.
      - 'backend/kukai/audit/**'
      - 'backend/kukai/query/model_graph.py'
      - 'backend/kukai/query/model_graph_v3.py'
      - 'backend/kukai/query/model_snapshot.py'
      - 'backend/kukai/norm_control.py'
      - 'backend/kukai/codecad/**'
      - 'backend/kukai/llm/tool_handlers/family_tools.py'
      - 'backend/kukai/llm/tool_handlers/family_codecad.py'
      - 'backend/kukai/write/**'
      - 'backend/scripts/audit_rules_compile_matrix.py'
      - 'backend/scripts/create_element_compile_matrix.py'
      - 'backend/scripts/emitted_csharp_compile_matrix.py'
      - 'backend/scripts/graph_compile_matrix.py'
      - 'backend/scripts/kir_gap_compile_matrix.py'
      - 'backend/scripts/kir_live_matrix.py'
      - 'backend/compile-service/**'
      - 'backend/tests/test_a5_lease_store.py'
      - 'backend/tests/test_assembly_whitelist_sync.py'
      - 'backend/tests/test_bridge_operation_v2.py'
      - 'backend/tests/test_compiler_contract.py'
      - 'backend/tests/test_operation_protocol.py'
      - 'backend/tests/test_revit_execution_pipeline.py'
      - 'src/Kukai.Revit.Bridge/**'
      - 'src/Kukai.Revit.Bridge.Tests/**'
      - '.github/scripts/kir_evidence_manifest.py'
      - '.github/scripts/kir_secret_boundary.py'
      - '.github/workflows/kir-evidence.yml'
      - '.github/workflows/kir-security.yml'
  push:
    branches: [main, prod-live]
    paths:
      - 'backend/kir_idempotence.py'
      - 'backend/kukai/ir/**'
      - 'backend/kukai/compile_client.py'
      - 'backend/kukai/llm/envelope.py'
      - 'backend/kukai/llm/revit_execution_pipeline.py'
      - 'backend/kukai/operations/**'
      - 'backend/kukai/storage/database.py'
      - 'backend/kukai/api/bridge_protocol.py'
      - 'backend/kukai/api/ws_registry.py'
      # Sources the four added compile matrices take as INPUT. Without these the
      # gate would not fire on the very edits it exists to catch — a rule that
      # never runs on the change it guards is not a gate.
      - 'backend/kukai/audit/**'
      - 'backend/kukai/query/model_graph.py'
      - 'backend/kukai/query/model_graph_v3.py'
      - 'backend/kukai/query/model_snapshot.py'
      - 'backend/kukai/norm_control.py'
      - 'backend/kukai/codecad/**'
      - 'backend/kukai/llm/tool_handlers/family_tools.py'
      - 'backend/kukai/llm/tool_handlers/family_codecad.py'
      - 'backend/kukai/write/**'
      - 'backend/scripts/audit_rules_compile_matrix.py'
      - 'backend/scripts/create_element_compile_matrix.py'
      - 'backend/scripts/emitted_csharp_compile_matrix.py'
      - 'backend/scripts/graph_compile_matrix.py'
      - 'backend/scripts/kir_gap_compile_matrix.py'
      - 'backend/scripts/kir_live_matrix.py'
      - 'backend/compile-service/**'
      - 'backend/tests/test_a5_lease_store.py'
      - 'backend/tests/test_assembly_whitelist_sync.py'
      - 'backend/tests/test_bridge_operation_v2.py'
      - 'backend/tests/test_operation_protocol.py'
      - 'backend/tests/test_revit_execution_pipeline.py'
      - 'src/Kukai.Revit.Bridge/**'
      - 'src/Kukai.Revit.Bridge.Tests/**'
      - '.github/scripts/kir_evidence_manifest.py'
      - '.github/scripts/kir_secret_boundary.py'
      - '.github/workflows/kir-evidence.yml'
      - '.github/workflows/kir-security.yml'

concurrency:
  group: ci-kir-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline:
    name: KIR + decompile + recovery (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install deterministic test surface
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install \
            "pytest>=8.0" \
            "pytest-asyncio>=0.24.0" \
            "pytest-httpx>=0.30.0"

      - name: Offline compiler evidence
        # Two tests in test_sketch_extract boot/build the real .NET service.
        # The generated-csharp-6x job below is their stronger CI replacement:
        # it provisions the complete matrix, proves missing-ref startup refusal,
        # checks /ready, then compiles the full generated corpus 6/6.
        run: |
          python -m pytest -q -p no:cacheprovider -p no:randomly \
            kukai/ir/tests \
            kukai/ir/decompile/tests \
            -k "not test_in_process_roslyn_gate_compiles_provisioned_refs_and_fails_closed and not test_configured_override_lets_the_gate_start_on_a_reduced_matrix"

      - name: Recovery and execution-protocol evidence
        run: |
          python -m pytest -q -p no:cacheprovider -p no:randomly \
            tests/test_assembly_whitelist_sync.py \
            tests/test_operation_protocol.py \
            tests/test_bridge_operation_v2.py \
            tests/test_revit_execution_pipeline.py \
            tests/test_a5_lease_store.py

  generated-csharp-6x:
    name: generated C# × Revit 2021–2026
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # 🔴 КОНТЕКСТ `runner` НЕ СУЩЕСТВУЕТ НА УРОВНЕ ДЖОБА. Пока эта величина
      # стояла в `env:` джоба, GitHub отказывался разбирать ВЕСЬ файл целиком —
      # не джоб и не шаг, — и прогон умирал до запуска единого задания. Замер
      # 16.08.2026: 171 прогон из 175 с `jobs.total_count == 0`, `/logs` → 404,
      # `created_at == updated_at`, а поле `name` у прогона было ПУТЁМ ФАЙЛА
      # вместо объявленного `CI — KIR compiler evidence`. Ошибку назвал сам
      # GitHub через `POST /actions/workflows/<wf>/dispatches` с валидным
      # реф'ом: «Unrecognized named-value: 'runner'».
      #
      # Переменная окружения раннера доступна там, где контекста ещё нет.
      # `$GITHUB_ENV` пробрасывает её и в шелл последующих шагов, и в контекст
      # `env`, которым ниже пользуется шаг кэша.
      - name: Point NuGet at the runner temp
        shell: bash
        run: echo "NUGET_PACKAGES=$RUNNER_TEMP/kir-nuget-packages" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache exact compiler reference packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: kir-compile-refs-${{ runner.os }}-${{ hashFiles('backend/compile-service/CompileService.csproj') }}
          restore-keys: |
            kir-compile-refs-${{ runner.os }}-

      - name: Restore the owned six-version reference matrix
        run: dotnet restore backend/compile-service/CompileService.csproj --nologo

      - name: Verify reference payloads and build compile-service
        shell: bash
        run: |
          set -euo pipefail
          for version in 2021 2022 2023 2024 2025 2026; do
            if (( version >= 2025 )); then framework=net8.0; else framework=net48; fi
            ref_dir="$NUGET_PACKAGES/revit_all_main_versions_api_x64/$version.0.0/lib/$framework"
            test -s "$ref_dir/RevitAPI.dll"
            test -s "$ref_dir/RevitAPIUI.dll"
          done
          test -d "$NUGET_PACKAGES/microsoft.netframework.referenceassemblies.net48/1.0.3/build/.NETFramework/v4.8"
          dotnet build backend/compile-service/CompileService.csproj \
            -c Release --no-restore --nologo

      - name: Install compile-gate client
        # `gate_runner` needs only httpx. The four added matrices import real
        # production modules (kukai.audit.rules, kukai.query.model_graph,
        # kukai.write.operations, kukai.ir.compiler …), so they need the app's
        # dependency set — the same one Gate A of ci.yml proves is sufficient to
        # import the whole live app.
        run: |
          python -m pip install --upgrade pip
          pip install "httpx>=0.27.0"
          pip install -r backend/requirements.txt

      - name: Fail closed when the reference matrix is absent
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          empty_packages="$RUNNER_TEMP/kir-empty-nuget"
          mkdir -p "$empty_packages"
          set +e
          NUGET_PACKAGES="$empty_packages" timeout 30s \
            dotnet backend/compile-service/bin/Release/net8.0/CompileService.dll \
            >"$RUNNER_TEMP/compile-service-missing.log" 2>&1
          exit_code=$?
          set -e
          if [[ $exit_code -eq 0 || $exit_code -eq 124 ]]; then
            cat "$RUNNER_TEMP/compile-service-missing.log"
            echo "::error::compile-service did not refuse an absent reference matrix"
            exit 1
          fi
          grep -F "Compile service startup refused" \
            "$RUNNER_TEMP/compile-service-missing.log"
          for version in 2021 2022 2023 2024 2025 2026; do
            grep -F "$version" "$RUNNER_TEMP/compile-service-missing.log"
          done

      - name: Compile the generated corpus on all six Revit APIs
        shell: bash
        run: |
          set -euo pipefail
          service_log="$RUNNER_TEMP/compile-service.log"
          ready_json="$RUNNER_TEMP/compile-ready.json"
          dotnet backend/compile-service/bin/Release/net8.0/CompileService.dll \
            >"$service_log" 2>&1 &
          service_pid=$!
          cleanup() {
            kill "$service_pid" 2>/dev/null || true
            wait "$service_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$service_pid" 2>/dev/null; then
              cat "$service_log"
              echo "::error::compile-service exited before readiness"
              exit 1
            fi
            if curl --fail --silent --show-error \
              http://127.0.0.1:52412/ready >"$ready_json"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ $ready -ne 1 ]]; then
            cat "$service_log"
            echo "::error::compile-service did not become ready"
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["RUNNER_TEMP"], "compile-ready.json").read_text()
          )
          expected = ["2021", "2022", "2023", "2024", "2025", "2026"]
          assert payload["status"] == "ready", payload
          assert payload["versions"] == expected, payload
          assert payload["requiredVersions"] == expected, payload
          assert payload["missingVersions"] == [], payload
          assert payload["failedReferences"] == [], payload
          print(json.dumps(payload, indent=2))
          PY

          # Оба вывода уходят в файл РЯДОМ с логом: шаг сводки ниже собирает из
          # них строки «ОТКАЗ ПРИБОРА». `pipefail` включён в шапке шага, поэтому
          # `| tee` не съедает ненулевой код возврата — проверено формой:
          # инструмент, спрятавший свой отказ за успехом конвейера, и есть тот
          # дефект, ради которого вся эта машинерия.
          PYTHONPATH=backend python -m kukai.ir.gate_runner \
            | tee "$RUNNER_TEMP/gate-runner.txt"

          # ── The four matrices that were built and never automated ──────────
          # Measured 2026-08-04 against this same service, all green, all fast:
          #   graph            18/18   (3 queries × 6)          0.5 s
          #   audit_rules     144/144  (24 rules × 6)           1.0 s
          #   emitted_csharp  324/324  (54 artifacts × 6)       1.6 s
          #   kir_gap         114/114  (19 rows × 6, 1 declared
          #                             refusal: Ceiling.Create
          #                             is 2022+)               2.2 s
          # Each exits non-zero on any failure, so `set -e` above is the gate.
          # They must run from backend/: every one starts with sys.path.insert(0, ".").
          cd backend
          python scripts/graph_compile_matrix.py
          python scripts/audit_rules_compile_matrix.py
          python scripts/emitted_csharp_compile_matrix.py
          python scripts/kir_gap_compile_matrix.py \
            | tee "$RUNNER_TEMP/kir-gap-matrix.txt"

          # ── create_element templates: 82/84, and that is CORRECT ───────────
          # `Floor.Create` is 2022+ and the floor template deliberately carries no
          # legacy NewFloor fork (create_floor.manifest.yaml: "Verified API (2022+
          # only)"), so its two artifacts cannot compile on 2021 and never will
          # while that decision stands. The product does not lie about it: since
          # 2026-08-04 `execute_create_element` refuses a floor on a KNOWN year
          # below the floor of `_MIN_REVIT_YEAR` (kukai/write/create_element.py),
          # by name, before grounding.
          #
          # So the gate here is not "zero failures", it is "exactly the failures
          # the product declares" — and the declaration is READ FROM THE PRODUCT
          # TABLE, not copied into this file. Consequences, both wanted:
          #   * any NEW red cell is red here, including a second one on floor/2021;
          #   * if someone teaches the template a 2021 path and the cells go green,
          #     this goes RED until the `_MIN_REVIT_YEAR` row is removed — the
          #     refusal and the matrix cannot drift apart.
          set +e
          python scripts/create_element_compile_matrix.py | tee "$RUNNER_TEMP/ce-matrix.txt"
          set -e
          python - <<'PY'
          import os, re, sys
          sys.path.insert(0, ".")
          from kukai.write.create_element import _MIN_REVIT_YEAR
          from scripts.create_element_compile_matrix import CASES, VERSIONS

          out = open(os.path.join(os.environ["RUNNER_TEMP"], "ce-matrix.txt"),
                     encoding="utf-8").read()
          seen = set(re.findall(r"^FAIL template:(\S+) \[(\d{4})\]", out, re.M))
          declared = {
              (name, v)
              for name, _args in CASES
              for v in VERSIONS
              if int(v) < _MIN_REVIT_YEAR.get(name.split("/", 1)[0], (0,))[0]
          }
          if seen != declared:
              print("undeclared failures:", sorted(seen - declared))
              print("declared but now compiling (delete the _MIN_REVIT_YEAR row "
                    "and the caller refusal with it):", sorted(declared - seen))
              raise SystemExit(1)
          print(f"create_element matrix: {len(declared)} declared-unbuildable "
                f"cell(s), no undeclared failure")
          PY
          cd ..

      # 🔴 «МЫ ЭТОГО НЕ ПРОВЕРЯЛИ» ОБЯЗАНО БЫТЬ ВИДНО БЕЗ ЧТЕНИЯ ЛОГА.
      # Решение владельца 16.08.2026. У ворот три исхода — зелено · красно ·
      # ОТКАЗ ПРИБОРА, — и третий бесполезен, если живёт на 1100-й строке
      # лога: сводку читают, лог нет. `if: always()` несущий — отказ прибора
      # чаще всего сопровождает красный, и именно тогда он и нужен.
      - name: Отказы прибора — в сводку прогона
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## Что этот прогон проверил и чего НЕ проверял"
            echo
            # 🔴 ОБЕ ПОЛОВИНЫ, А НЕ ОДНА. Первая редакция печатала только
            # отказы — и это провалило собственную цель: читающий видел, ЧЕГО
            # не проверяли, и не видел, МНОГО ЛИ проверили, а значит не мог
            # отличить «проверено и чисто, с одним названным пробелом» от
            # «не судили почти ничего». Прочитано глазами 16.08.2026 на
            # настоящем выводе прогона, а не задумано.
            echo "### Проверено"
            echo '```'
            grep -ahE "^PASS:|^FAIL:|собрано Roslyn|^ЗЕЛЕНО|^КРАСНО|^ЯЧЕЕК" \
              "$RUNNER_TEMP/gate-runner.txt" "$RUNNER_TEMP/kir-gap-matrix.txt" \
              2>/dev/null || echo "(строк итога нет — приборы не дошли до итога)"
            echo '```'
            echo
            echo "### Проверить было НЕЧЕМ"
            found=0
            for f in "$RUNNER_TEMP/gate-runner.txt" "$RUNNER_TEMP/kir-gap-matrix.txt"; do
              [ -s "$f" ] || continue
              if grep -a "ОТКАЗ ПРИБОРА" "$f" > "$RUNNER_TEMP/refusals.txt" 2>/dev/null; then
                found=1
                echo "\`$(basename "$f")\`:"
                echo '```'
                cat "$RUNNER_TEMP/refusals.txt"
                echo '```'
                echo
              fi
            done
            # Отсутствие файла и отсутствие отказов — РАЗНЫЕ факты, и второй
            # читается как «проверили всё». Молчать нельзя ни в одном случае.
            if [ ! -s "$RUNNER_TEMP/gate-runner.txt" ] \
               && [ ! -s "$RUNNER_TEMP/kir-gap-matrix.txt" ]; then
              echo "🔴 ВЫВОДА НЕТ ВООБЩЕ — шаг доказательств не дошёл до этих"
              echo "приборов. Это НЕ «отказов нет»."
            elif [ "$found" = "0" ]; then
              echo "Отказов прибора нет: оба прибора отработали на своих входах."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compile-service diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kir-compile-service-diagnostics
          path: |
            ${{ runner.temp }}/compile-service.log
            ${{ runner.temp }}/compile-service-missing.log
            ${{ runner.temp }}/compile-ready.json
          if-no-files-found: ignore
          retention-days: 7

  provenance:
    name: commit-bound KIR evidence
    needs: [offline, generated-csharp-6x]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KIR_OFFLINE_RESULT: ${{ needs.offline.result }}
      KIR_SIX_VERSION_RESULT: ${{ needs.generated-csharp-6x.result }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind successful evidence to the exact source commit
        run: |
          python .github/scripts/kir_evidence_manifest.py \
            --output kir-evidence-provenance.json

      - name: Upload commit-bound evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: kir-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: kir-evidence-provenance.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
