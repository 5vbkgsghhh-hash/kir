[project]
name = "kukai-backend"
version = "1.0.0"
description = "KUKAI AI Assistant for Autodesk Revit — Backend Server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "litellm>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",  # legacy: only used by IFC engine and migration script
    "python-multipart>=0.0.9",
    "defusedxml>=0.7.1",
    "cryptography>=42.0",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "networkx>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    # F6-C1: pytest-randomly catches order-dependent tests in CI before
    # they bite production. Tests must pass in any order.
    "pytest-randomly>=4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["kukai*"]
