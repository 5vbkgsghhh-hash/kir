[mypy]
python_version = 3.12
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
no_strict_optional = True
# Exclude generated/vendored code
exclude = (\.venv|__pycache__|dist)

[mypy-prometheus_client.*]
ignore_missing_imports = True

[mypy-structlog.*]
ignore_missing_imports = True

[mypy-aioredis.*]
ignore_missing_imports = True
